<!DOCTYPE html>

<html class="dark" lang="en"><head>

<title>EstateFlow | Secure Login</title>

<style>
        body {
            background-color: #121414;
            color: #e3e2e2;
            overflow: hidden;
            margin: 0;
            height: 100vh;
            width: 100vw;
        }
        .glass-card {
            background: rgba(23, 23, 23, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid #262626;
            box-shadow: 0 8px 30px rgba(0,0,0,0.5);
        }
        .input-etched {
            background-color: #0a0a0a;
            border: 1px solid #262626;
            transition: all 0.2s ease-in-out;
        }
        .input-etched:focus {
            border-color: #6366f1;
            box-shadow: 0 0 0 2px rgba(99, 102, 241, 0.2);
            outline: none;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 300, 'GRAD' 0, 'opsz' 24;
        }
        @keyframes float {
            0% { transform: translateY(0px) rotate(0deg); }
            50% { transform: translateY(-20px) rotate(2deg); }
            100% { transform: translateY(0px) rotate(0deg); }
        }
        .floating-bg {
            animation: float 15s ease-in-out infinite;
        }
    </style>

                        "on-surface": "#e3e2e2",

<body class="flex items-center justify-center min-h-screen bg-surface font-body-md text-body-md selection:bg-primary-container selection:text-on-primary-container relative">
<!-- Ambient Background Element -->
<div class="absolute inset-0 z-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-primary/10 blur-[120px] rounded-full floating-bg"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-secondary/10 blur-[120px] rounded-full floating-bg" style="animation-delay: -5s;"></div>
</div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-[440px] px-margin-mobile">
<div class="glass-card rounded-xl p-xl flex flex-col gap-lg">
<!-- Brand & Header -->
<header class="flex flex-col items-center text-center gap-sm">
<div class="w-12 h-12 bg-primary rounded-lg flex items-center justify-center mb-sm">
<span class="material-symbols-outlined text-on-primary text-[32px]" style="font-variation-settings: 'FILL' 1;">domain</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface tracking-tight">EstateFlow</h1>
<p class="font-body-md text-on-surface-variant">Welcome back to the elite portfolio manager.</p>
</header>
<!-- Form -->
<form class="flex flex-col gap-md" onsubmit="window.location.href='tabDashboard.html'; return false;">
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-on-surface-variant ml-xs" for="email">Email Address</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline text-[20px] group-focus-within:text-primary transition-colors">mail</span>
<input class="input-etched w-full pl-[48px] pr-md py-md rounded-lg text-on-surface placeholder:text-outline/50 font-body-md" id="email" placeholder="name@company.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<div class="flex justify-between items-center px-xs">
<label class="font-label-md text-label-md text-on-surface-variant" for="password">Password</label>
<a class="font-label-md text-label-md text-primary hover:text-primary-fixed-dim transition-colors" href="passwordReset.html">Forgot password?</a>
</div>
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline text-[20px] group-focus-within:text-primary transition-colors">lock</span>
<input class="input-etched w-full pl-[48px] pr-[48px] py-md rounded-lg text-on-surface placeholder:text-outline/50 font-body-md" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline hover:text-on-surface transition-colors" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Sign In Button -->
<button class="mt-sm w-full bg-[#6366f1] hover:bg-[#4f46e5] active:scale-[0.98] text-white font-semibold py-md rounded-lg transition-all shadow-lg shadow-indigo-500/20 flex items-center justify-center gap-sm">
                Sign In
                <span class="material-symbols-outlined text-[20px]">arrow_forward</span>
</button>
</form>
<!-- Divider -->
<div class="flex items-center gap-md py-xs">
<div class="h-px flex-1 bg-outline-variant/30"></div>
<span class="font-label-md text-label-md text-outline/50">OR CONTINUE WITH</span>
<div class="h-px flex-1 bg-outline-variant/30"></div>
</div>
<!-- Social/Secondary Options -->
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-sm py-sm border border-outline-variant rounded-lg hover:bg-surface-container transition-colors active:scale-95">
<img class="w-5 h-5" data-alt="Google logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuDV5zgxYrRORCbW-sZR9Ph_8P5BYWM2p25HVTMtiOZ3lOVH8PCFCB_YCwrFLmUtej-MkVtwLDfHRZJ_e7sICW29MrDbb7wvYkkxaHoL58dEhhd0RoNhxaJ_Fhha67hyR2whi31WGnKfQI2_b05g5HEsm_xHCRD_p-x7A1_Z4lejkKoAc-W0M__J-kcxtv-q-AFt-W8Fdp4U1wCdWfx7rAkAXAkyHId21u-tyWYzpXEPDsxrHnhftgyGY7jcX17iSJUG7ValeubCBKw_"/>
<span class="font-label-md text-label-md text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-sm py-sm border border-outline-variant rounded-lg hover:bg-surface-container transition-colors active:scale-95">
<img class="w-5 h-5" data-alt="Apple logo" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBzqqBuoe711zVmV26dMrNPHejiYRcmHJ7BTeLMTHDzItFp5z8ez3rnIJTS-kAKPmoE46WU2sWzkjMhnoNIpjvAaiYi9ti7CP4lP5DD7CrsWcgjjDREvpK7nTeZ0ydhcxkUI8wZaTYok6iduCtTTPy9sXAjVIs61ujQ0kGHBNxXVKwQNu7OvKrHgE8joETwMaU71sVGM5RBGysB_Oz69c29jjgIsY4bsjCl-MwhPdO6fe9Bwf2XJx6vgKmPMYWcORsl6YcxFmrmkuDO"/>
<span class="font-label-md text-label-md text-on-surface">Apple</span>
</button>
</div>
<!-- Sign Up Footer -->
<footer class="text-center pt-md border-t border-outline-variant/30">
<p class="font-body-md text-on-surface-variant">
                Don't have an account?
                <a class="text-primary font-semibold hover:underline decoration-2 underline-offset-4" href="signUp.html">Sign up</a>
</p>
</footer>
</div>
<!-- System Status Micro-copy -->
<div class="mt-lg flex justify-center items-center gap-lg">
<div class="flex items-center gap-xs">
<div class="w-1.5 h-1.5 rounded-full bg-emerald-500 shadow-[0_0_8px_rgba(16,185,129,0.6)]"></div>
<span class="font-label-md text-label-md text-outline">System Operational</span>
</div>
<div class="flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px] text-outline">verified_user</span>
<span class="font-label-md text-label-md text-outline">End-to-End Encrypted</span>
</div>
</div>
</main>
<script>
    function togglePassword() {
        const pwdInput = document.getElementById('password');
        const toggleIcon = document.getElementById('password-toggle-icon');
        if (pwdInput.type === 'password') {
            pwdInput.type = 'text';
            toggleIcon.innerText = 'visibility_off';
        } else {
            pwdInput.type = 'password';
            toggleIcon.innerText = 'visibility';
        }
    }

    // Micro-interaction for primary button
    const signInBtn = document.querySelector('button.bg-[#6366f1]');
    signInBtn.addEventListener('click', () => {
        const originalContent = signInBtn.innerHTML;
        signInBtn.innerHTML = `
            <svg class="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
              <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
              <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
            </svg>
            Processing...
        `;
        setTimeout(() => {
            signInBtn.innerHTML = originalContent;
        }, 2000);
    });
</script>
</body></html>
